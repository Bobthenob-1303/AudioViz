<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BeatBox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>BeatBox</h1>

<div id="controls">
  <button id="micBtn">Start Mic</button>
  <button id="stopBtn">Stop</button>
</div>

<div id="status">Idle</div>

<div id="player" style="display:none;">
  <audio id="audioEl" controls></audio>
</div>

<div id="visualizerWrap">
  <img class="cat cat1" id="cat1" src="Cat1.png" alt="Cat 1">
  <img class="cat cat2" id="cat2" src="Cat2.png" alt="Cat 2">
  <img class="cat cat3" id="cat3" src="Cat3.png" alt="Cat 3">
  <div id="grid"></div>
</div>

<div id="dropZone">Drag & drop an audio file here, or click to upload</div>
<input type="file" id="fileInput" accept=".wav,audio/wav,audio/*">

<script src="script.js"></script>
</body>
</html>
